name: sales-pilot

services:
  n8n:
    # Installed and schema-checked version: 2.43.7. Pin exact image, not latest.
    image: n8nio/n8n@sha256:3db21366be1d3c77c1708963129c051948573019659e8873e0294be035ffc1b2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_EDITOR_PORT:-5679}:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_EDITOR_PORT:-5679}
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_LOG_LEVEL: warn
      N8N_PAYLOAD_SIZE_MAX: 20
      N8N_CONCURRENCY_PRODUCTION_LIMIT: 2
      EXECUTIONS_TIMEOUT: 60
      EXECUTIONS_TIMEOUT_MAX: 60
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 1
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: 100
      EXECUTIONS_DATA_HARD_DELETE_BUFFER: 1
      EXECUTIONS_DATA_PRUNE_HARD_DELETE_INTERVAL: 15
      EXECUTIONS_DATA_PRUNE_SOFT_DELETE_INTERVAL: 15
      TZ: America/Santiago
      GENERIC_TIMEZONE: America/Santiago
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - processing
      # A normal bridge lets Docker Desktop publish the loopback editor port.
      # The processing bridge remains internal; Caddy never joins this network.
      - management
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 200
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

  web:
    build: .
    restart: unless-stopped
    init: true
    depends_on:
      n8n:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
      PILOT_USERS_JSON: ${PILOT_USERS_JSON:?Set PILOT_USERS_JSON in .env}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/sales-web
      N8N_QUOTATION_WEBHOOK_URL: http://n8n:5678/webhook/quotation-web
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:?Set N8N_WEBHOOK_SECRET in .env}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      PROCESSING_TIMEOUT_MS: ${PROCESSING_TIMEOUT_MS:-65000}
      RESULT_TTL_MINUTES: ${RESULT_TTL_MINUTES:-15}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      MAX_CONCURRENT_UPLOADS: ${MAX_CONCURRENT_UPLOADS:-2}
      MAX_JOBS_PER_SESSION: ${MAX_JOBS_PER_SESSION:-3}
      MAX_STORED_BYTES: ${MAX_STORED_BYTES:-134217728}
    networks:
      - processing
      - frontend
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 100
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"

networks:
  processing:
    internal: true
  management:
  frontend:

volumes:
  n8n_data:
